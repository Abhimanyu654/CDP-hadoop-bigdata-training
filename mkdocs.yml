site_name: CDP & Hadoop Big Data Training
site_description: Architecture, components, dependencies, operations, and interview preparation for CDP and Hadoop.
site_author: Abhimanyu Kumar
repo_url: https://github.com/Abhimanyu654/hadoop-bigdata-training
repo_name: Abhimanyu654/hadoop-bigdata-training

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

